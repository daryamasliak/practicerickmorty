<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Rick and Morty API</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div id="site-container" class="site-container">
      <header class="site-header">
        <div class="header-top-row">
          <div class="logo" id="logo">
            <img src="../public/logo.png" alt="Logo" id="logo-img" />
            <span>RICK & MORTY API</span>
          </div>

          <nav class="header-nav">
            <div class="dropdown">
              <button class="dropdown-btn">
                Characters <span class="arrow">▼</span>
              </button>
              <div class="dropdown-content">
                <button class="filter-btn" data-status="">
                  All characters
                </button>
                <button class="filter-btn" data-status="alive">🟢 Alive</button>
                <button class="filter-btn" data-status="dead">🔴 Dead</button>
                <button class="filter-btn" data-status="unknown">
                  🟡 Unknown
                </button>
              </div>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="Search character..."/>
          </nav>

          <button id="burger-menu-btn" class="burger-btn">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <div class="header-bottom-row">
          <button id="create-char-btn">Create new character +</button>
          <a href="experimental.html" target="_blank" class="btn-experimental"
            >Open full form for a new character</a
          >
        </div>
      </header>

      <aside id="sidebar-right" class="sidebar sidebar-right">
        <button id="close-right-btn" class="sidebar-close-btn">&times;</button>
        <h2 class="sidebar-title">Multiverse menu</h2>
        <nav id="sidebar-navigation" class="sidebar-nav"></nav>
      </aside>

      <h1 class="main-title">The Rick and Morty API</h1>

      <div id="loader" class="loader hidden"></div>

      <main class="portal">
        <div id="form-container" class="hidden">
          <form id="character-form" novalidate>
            <div class="form-group">
              <label for="char-name">Name:</label>
              <input
                type="text"
                id="char-name"
                name="name"
                placeholder="Maximum 10 symbols"
                required
              />
              <span id="name-error" class="error-message"></span>
            </div>

            <div class="form-group">
              <label for="char-age">Age:</label>
              <input
                type="text"
                id="char-age"
                name="age"
                placeholder="Only whole numbers"
                required
              />
              <span id="age-error" class="error-message"></span>
            </div>

            <div class="form-group">
              <label for="char-gender">Gender:</label>
              <select id="char-gender" name="gender" required>
                <option value="" disabled selected>Choose your gender:</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
              <span id="gender-error" class="error-message"></span>
            </div>

            <div class="form-group">
              <span class="label-text">Status:</span>

              <label class="switch-container">
                <input
                  type="checkbox"
                  id="char-status"
                  name="isAlive"
                  checked
                />
                <span class="switch-slider"></span>
              </label>

              <span id="status-text">Alive</span>
            </div>

            <button type="submit" id="submit-btn">
              Create a new character
            </button>
          </form>
        </div>
        <div id="cards-container" class="cards-container"></div>
        <div id="pagination-container" class="pagination-container"></div>
      </main>

      <footer class="footer">
        <a
          href="https://rickandmortyapi.com/api/character"
          target="_blank"
          class="footer-item"
        >
          <span class="label">Characters</span>
          <span id="characters-count" class="value"></span>
        </a>
        <a
          href="https://rickandmortyapi.com/api/location"
          target="_blank"
          class="footer-item"
        >
          <span class="label">Locations</span>
          <span id="locations-count" class="value"></span>
        </a>
        <a
          href="https://rickandmortyapi.com/api/episode"
          target="_blank"
          class="footer-item"
        >
          <span class="label">Episodes</span>
          <span id="episodes-count" class="value"></span>
        </a>
      </footer>
    </div>

    <div id="backdrop-overlay" class="backdrop-overlay"></div>

    <script type="module" src="../result/src/pages/main.js"></script>
    <script type="module" src="../result/src/pages/form-page.js"></script>
  </body>
</html>
