<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Rick and Morty API</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="site-container" class="site-container">
      <header class="site-header">
        <div class="logo" id="logo">
          <img src="../public/logo.png" alt="Logo" id="logo-img" />
          <span>RICK & MORTY API</span>
        </div>

        <nav class="header-nav">
          <div class="dropdown">
            <button class="dropdown-btn">
              Characters <span class="arrow">▼</span>
            </button>
            <div class="dropdown-content">
              <button class="filter-btn" data-status="">All characters</button>
              <button class="filter-btn" data-status="alive">🟢 Alive</button>
              <button class="filter-btn" data-status="dead">🔴 Dead</button>
              <button class="filter-btn" data-status="unknown">
                🟡 Unknown
              </button>
            </div>
          </div>
        </nav>

        <button id="burger-menu-btn" class="burger-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <div id="sidebar-right" class="sidebar sidebar-right">
        <button class="sidebar-close-btn" id="close-right-btn">&times;</button>
        <div class="sidebar-content">
          <h3>Navigation through the Universe</h3>

          <nav class="sidebar-nav-links">
            <a
              href="https://rickandmortyapi.com/documentation"
              target="_blank"
              class="sidebar-link"
              >Docs</a
            >
            <a
              href="https://rickandmortyapi.com/about"
              target="_blank"
              class="sidebar-link"
              >About Us</a
            >
            <a
              href="https://rickandmortyapi.com/support-us"
              target="_blank"
              class="sidebar-link-btn"
              >Support Us</a
            >
          </nav>
        </div>
      </div>

      <h1 class="main-title">The Rick and Morty API</h1>

      <div id="loader" class="loader hidden"></div>

      <main class="portal">
        <div id="cards-container" class="cards-container"></div>
        <div id="pagination-container" class="pagination-container"></div>
      </main>

      <footer class="footer">
        <a
          href="https://rickandmortyapi.com/api/character"
          target="_blank"
          class="footer-item"
        >
          <span class="label">Characters</span>
          <span id="characters-count" class="value"></span>
        </a>
        <a
          href="https://rickandmortyapi.com/api/location"
          target="_blank"
          class="footer-item"
        >
          <span class="label">Locations</span>
          <span id="locations-count" class="value"></span>
        </a>
        <a
          href="https://rickandmortyapi.com/api/episode"
          target="_blank"
          class="footer-item"
        >
          <span class="label">Episodes</span>
          <span id="episodes-count" class="value"></span>
        </a>
      </footer>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
